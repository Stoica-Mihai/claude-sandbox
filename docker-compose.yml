x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3

# Single-sourced Go toolchain version for every Go service's build.
x-go-version: &go-version "1.26.1"

# Host UID/GID build args, shared by the two containers that write the mounted
# socket/upload/config volumes (so files stay owned by the host user).
x-uidgid: &uidgid
  UID: ${UID:-1000}
  GID: ${GID:-1000}

# The mounts the sessions and backend containers share: workspace, the scoped
# Claude config dir, the read-write settings file, and the claude-state volume
# (sessiond sockets + uploads). Both must agree on the claude-state mount, so
# it lives here once.
x-claude-volumes: &claude-volumes
  - ${WORKSPACE_PATH:-../}:/workspace
  - ${HOME}/.claude-sandbox:/home/claude/.claude-sandbox
  - ./container-settings.json:/home/claude/container-settings.json
  - claude-state:/home/claude/.local/state/claude
  - logs:/logs

services:
  sessions:
    build:
      context: .
      dockerfile: Dockerfile.sessions
      args:
        <<: *uidgid
        GO_VERSION: *go-version
    container_name: claude_sessions
    tty: true
    stdin_open: true
    init: true
    restart: unless-stopped
    develop:
      watch:
        # Rebuilding this service ends running sessions — sessiond source only.
        - action: rebuild
          path: ./sessiond/
    security_opt:
      # seccomp must stay unconfined: Claude Code's bubblewrap sandbox needs
      # unprivileged user namespaces, which Docker's default seccomp profile
      # blocks. AppArmor's default profile does NOT block it, so we keep
      # AppArmor enabled (only seccomp is relaxed).
      - seccomp:unconfined

    # Disable IPv6 in the container. api.anthropic.com is dual-stack; with no
    # usable IPv6 egress, claude's (Bun) startup fetches intermittently attempt
    # the AAAA address and stall on the connect timeout (10-30s blank screen)
    # before falling back to IPv4. Removing the v6 stack forces IPv4 instantly.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

    volumes: *claude-volumes

    environment:
      - HOME=/home/claude
      - LOG_DIR=/logs

    # No exposed ports — sessiond speaks unix sockets only
    networks:
      - claude-net

    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/home/claude/sessiond", "-ping"]
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

    logging: *logging

    working_dir: /workspace

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        <<: *uidgid
        GO_VERSION: *go-version
    container_name: claude_backend
    restart: unless-stopped
    develop:
      watch:
        # Backend rebuilds do NOT touch running sessions (they live in the
        # sessions container); sessiond/ is watched for the protocol package.
        - action: rebuild
          path: ./backend/
        - action: rebuild
          path: ./shared/
        - action: rebuild
          path: ./sessiond/

    volumes: *claude-volumes

    environment:
      - HOME=/home/claude
      - BACKEND_PORT=${BACKEND_PORT:-8081}
      - LOG_DIR=/logs

    # No exposed ports — only reachable via internal network
    networks:
      - claude-net

    depends_on:
      sessions:
        condition: service_healthy

    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8081}/healthz"]
      start_period: 5s

    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        <<: *uidgid
        GO_VERSION: *go-version
    container_name: claude_frontend
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend/
        - action: rebuild
          path: ./shared/

    environment:
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - TUNNEL_PORT=${TUNNEL_PORT:-8090}
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8081}
      - HOLESAIL_URL=http://holesail:${SHARE_CONTROL_PORT:-9000}
      - LOGD_URL=http://logd:${LOGD_PORT:-8082}
      - LOG_DIR=/logs
      - ALLOWED_WS_ORIGINS=${ALLOWED_WS_ORIGINS:-}

    volumes:
      - logs:/logs

    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"

    networks:
      - claude-net

    # No depends_on logd: it is non-critical, so the dashboard boots even if the
    # log service is down (/api/logs 502s gracefully).
    depends_on:
      backend:
        condition: service_healthy
      holesail:
        condition: service_healthy

    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:${DASHBOARD_PORT:-8080}/healthz"]
      start_period: 5s

    logging: *logging

  holesail:
    build:
      context: .
      dockerfile: Dockerfile.holesail
    container_name: claude_holesail
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./holesail/

    environment:
      - SHARE_TARGET_HOST=frontend
      # Tunnel traffic targets the frontend's dedicated tunnel listener, so the
      # frontend can tell tunnel visitors from LAN users by socket, not by IP.
      - SHARE_TARGET_PORT=${TUNNEL_PORT:-8090}
      - SHARE_CONTROL_PORT=${SHARE_CONTROL_PORT:-9000}

    volumes:
      # Persistent share key — the connection string is derived from it, so
      # the same key means the same string across restarts.
      - holesail-share-key:/data

    # No exposed ports — control API reachable only via internal network
    networks:
      - claude-net

    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:${SHARE_CONTROL_PORT:-9000}/healthz"]
      start_period: 5s

    logging: *logging

  logd:
    build:
      context: .
      dockerfile: Dockerfile.logd
      args:
        <<: *uidgid
        GO_VERSION: *go-version
    container_name: claude_logd
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./logd/
        - action: rebuild
          path: ./shared/

    environment:
      - LOGS_DIR=/logs
      - STATE_DIR=/state
      - LOGD_PORT=${LOGD_PORT:-8082}

    volumes:
      # Read-only view of the shared logs (logd only tails; it never writes here)
      # plus its own writable offset-checkpoint volume.
      - logs:/logs:ro
      - logd-state:/state

    # No exposed ports — reachable only via the internal network (guarded proxy).
    networks:
      - claude-net

    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:${LOGD_PORT:-8082}/healthz"]
      start_period: 5s

    logging: *logging

networks:
  claude-net:
    driver: bridge

volumes:
  claude-state:
  holesail-share-key:
  logs:
  logd-state:
