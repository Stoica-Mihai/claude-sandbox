services:
  claude-env:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: claude_workspace
    tty: true
    stdin_open: true
    init: true
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined

    volumes:
      # Project files
      - ${WORKSPACE_PATH:-../}:/workspace
      - ./container-settings.json:/home/claude/.claude/settings.json:ro
      # Host session/auth files
      - ${HOME}/.claude.json:/home/claude/.claude.json
      - ${HOME}/.claude/.credentials.json:/home/claude/.claude/.credentials.json:ro

    environment:
      - HOME=/home/claude
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}

    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DASHBOARD_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    working_dir: /workspace

    command: /home/claude/dashboard-server
