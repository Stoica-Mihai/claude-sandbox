x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: claude_backend
    tty: true
    stdin_open: true
    init: true
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./backend/
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined

    volumes:
      # Project files
      - ${WORKSPACE_PATH:-../}:/workspace
      - ./container-settings.json:/home/claude/.claude/settings.json:ro
      # Host session/auth files
      - ${HOME}/.claude.json:/home/claude/.claude.json
      - ${HOME}/.claude/.credentials.json:/home/claude/.claude/.credentials.json:ro

    environment:
      - HOME=/home/claude
      - BACKEND_PORT=8081

    # No exposed ports — only reachable via internal network
    networks:
      - claude-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

    logging: *logging

    working_dir: /workspace

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: claude_frontend
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./frontend/

    environment:
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - BACKEND_URL=http://backend:8081

    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"

    networks:
      - claude-net

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DASHBOARD_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging: *logging

networks:
  claude-net:
    driver: bridge
