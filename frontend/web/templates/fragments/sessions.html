{{define "sessions"}}
<span id="session-count" class="hidden">{{len .Sessions}}</span>
{{if .Sessions}}
{{range .Sessions}}
<div class="scard session-card"
     data-terminal-id="{{.Name}}"
     data-session="{{.DisplayName}}"
>
    <div class="row1">
        <i class="live{{if not .Alive}} dead{{end}}"></i>
        <span class="nm">{{.DisplayName}}</span>
        <div class="acts">
            <div class="iconbtn" title="Rename" onclick="event.stopPropagation(); openRenameModal('{{.Name}}', '{{.DisplayName}}')">&#9998;</div>
            <div class="iconbtn kill" title="Kill"
                 hx-delete="/api/sessions/{{.Name}}"
                 hx-target="#session-list"
                 hx-swap="innerHTML"
                 onclick="event.stopPropagation(); cleanupKilledSession('{{.Name}}')">&times;</div>
        </div>
    </div>
    <div class="row2">
        <span class="cwd">{{.CWD}}</span>
        <span class="dur session-duration" data-created="{{.CreatedAt.Unix}}">{{.Duration}}</span>
    </div>
</div>
{{end}}
{{else}}
<div class="empty">
    No sessions running<br>
    <span class="faint">Click "+ NEW" to create a session.</span>
</div>
{{end}}
{{end}}
