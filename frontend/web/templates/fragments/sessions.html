{{define "sessions"}}
<span id="session-count" class="hidden">{{len .Sessions}}</span>
{{if .Sessions}}
{{range .Sessions}}
<div class="scard session-card"
     data-terminal-id="{{.Name}}"
     data-session="{{.DisplayName}}"
     title="{{.DisplayName}}"
     aria-label="{{.DisplayName}}"
     role="button"
     tabindex="0"
>
    <div class="row1">
        <i class="live{{if not .Alive}} dead{{end}}"></i>
        <span class="mono">{{printf "%.1s" .DisplayName}}</span>
        <span class="nm">{{.DisplayName}}</span>
        <div class="acts">
            <button type="button" class="iconbtn" title="Rename" aria-label="Rename session"
                    onclick="event.stopPropagation(); openRenameModal('{{.Name}}', '{{.DisplayName}}')">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button type="button" class="iconbtn danger" title="Kill" aria-label="Kill session"
                    hx-delete="/api/sessions/{{.Name}}"
                    hx-target="#session-list"
                    hx-swap="innerHTML"
                    onclick="event.stopPropagation(); cleanupKilledSession('{{.Name}}')">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
    </div>
    <div class="row2">
        <span class="cwd">{{.CWD}}</span>
        <span class="dur session-duration" data-created="{{.CreatedAt.Unix}}"></span>
    </div>
</div>
{{end}}
{{else}}
<div class="empty-state">
    No sessions running<br>
    <span class="faint">Click "+ NEW" to create a session.</span>
</div>
{{end}}
{{end}}
