{{define "sessions"}}
<span id="session-count" class="hidden">{{len .Sessions}}</span>
{{if .Sessions}}
{{range .Sessions}}
<div class="session-card rounded-lg px-3 py-2 cursor-pointer group select-none"
     data-terminal-id="{{.Name}}"
     data-session="{{.DisplayName}}"
     style="--hue: {{.Hue}};"
>
    <div class="flex items-center gap-2 min-w-0">
        {{if .Alive}}
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-alive shrink-0"></span>
        {{else}}
        <span class="w-1.5 h-1.5 rounded-full bg-base-content/20 shrink-0"></span>
        {{end}}
        <span class="font-medium text-sm text-base-content truncate flex-1">{{.DisplayName}}</span>
        <div class="flex items-center gap-0.5 shrink-0">
            <button onclick="event.stopPropagation(); openRenameModal('{{.Name}}', '{{.DisplayName}}')"
                    class="btn btn-ghost btn-xs btn-square text-base-content/40 hover:text-base-content hover:bg-base-content/10 opacity-0 group-hover:opacity-100 transition-all"
                    title="Rename session">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487z"/></svg>
            </button>
            <button class="btn btn-ghost btn-xs btn-square text-base-content/40 hover:text-error hover:bg-error/10 opacity-0 group-hover:opacity-100 transition-all"
                    title="Kill session"
                    hx-delete="/api/sessions/{{.Name}}"
                    hx-target="#session-list"
                    hx-swap="innerHTML"
                    onclick="event.stopPropagation(); cleanupKilledSession('{{.Name}}')">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </div>
    <div class="flex items-center justify-between mt-0.5 pl-3.5">
        <span class="text-[11px] text-base-content/35 truncate font-mono">{{.CWD}}</span>
        <span class="text-[10px] text-base-content/30 font-mono shrink-0 ml-2 session-duration" data-created="{{.CreatedAt.Unix}}">{{.Duration}}</span>
    </div>
</div>
{{end}}
{{else}}
<div class="flex flex-col items-center justify-center py-12 text-center select-none">
    <svg class="w-10 h-10 text-base-content/15 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
    <p class="text-sm text-base-content/40 mb-1">No sessions running</p>
    <p class="text-xs text-base-content/25">Click "New" to create a session</p>
</div>
{{end}}
{{end}}
