{{define "directory-picker"}}
<form id="dir-picker-form" hx-post="/api/sessions" hx-target="#session-list" hx-swap="innerHTML">
    <!-- Breadcrumb (HTMX navigates the browse level) -->
    <div id="dp-breadcrumb" class="crumb">
        <span class="seg" hx-get="/api/directories?path=" hx-target="#dir-picker" hx-swap="innerHTML">/workspace</span>
        {{range .Breadcrumbs}}
        <span class="sep">/</span>
        <span class="seg" hx-get="/api/directories?path={{.Path}}" hx-target="#dir-picker" hx-swap="innerHTML">{{.Name}}</span>
        {{end}}
    </div>

    <!-- cwd = selected folder; resume = uuid when a previous session is selected -->
    <input type="hidden" name="cwd" id="dir-picker-cwd" value="" />
    <input type="hidden" name="resume" id="dir-picker-resume" value="" />

    <!-- Folder list: row click selects the folder; the › drill button opens its subfolders -->
    <div id="dp-folders" class="folders">
        {{if .Dirs}}
        {{range .Dirs}}
        <div class="frow">
            <button type="button" class="fmain"
                    onclick="dpSelectFolder('{{$.FullPath}}/{{.}}', '{{.}}')">
                <span class="fico">▸</span>
                <span class="fnm">{{.}}</span>
            </button>
            <button type="button" class="drill"
                    hx-get="/api/directories?path={{$.Path}}{{if $.Path}}/{{end}}{{.}}"
                    hx-target="#dir-picker" hx-swap="innerHTML" title="Open subfolders">›</button>
        </div>
        {{end}}
        {{else}}
        <div class="empty">No subfolders</div>
        {{end}}
    </div>

    <!-- Selected folder's actions (start-new + previous sessions); filled by views.js -->
    <div id="session-actions"></div>
</form>
{{end}}
