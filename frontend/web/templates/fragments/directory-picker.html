{{define "directory-picker"}}
<form id="dir-picker-form" hx-post="/api/sessions" hx-target="#session-list" hx-swap="innerHTML">
    <!-- Breadcrumb (HTMX navigates the browse level) -->
    <nav id="dp-breadcrumb" class="dp-crumb" aria-label="Breadcrumb">
        <button type="button" class="seg" hx-get="/api/directories?path=" hx-target="#dir-picker" hx-swap="innerHTML">/workspace</button>
        {{range .Breadcrumbs}}
        <span class="sep">/</span>
        <button type="button" class="seg" hx-get="/api/directories?path={{.Path}}" hx-target="#dir-picker" hx-swap="innerHTML">{{.Name}}</button>
        {{end}}
    </nav>

    <!-- cwd = selected folder; resume = uuid when a previous session is selected -->
    <input type="hidden" name="cwd" id="dir-picker-cwd" value="" />
    <input type="hidden" name="resume" id="dir-picker-resume" value="" />

    <!-- Folder list: row click selects the folder; the › drill button opens its subfolders -->
    <div id="dp-folders" class="folders">
        {{if .Dirs}}
        {{range .Dirs}}
        <div class="frow">
            <button type="button" class="fmain"
                    onclick="dpSelectFolder('{{$.FullPath}}/{{.}}', '{{.}}')">
                <span class="fico">▸</span>
                <span class="fnm">{{.}}</span>
            </button>
            <button type="button" class="drill"
                    hx-get="/api/directories?path={{$.Path}}{{if $.Path}}/{{end}}{{.}}"
                    hx-target="#dir-picker" hx-swap="innerHTML" title="Open subfolders">›</button>
        </div>
        {{end}}
        {{else}}
        <div class="empty-state">No subfolders</div>
        {{end}}
    </div>

    <!-- Create a new project in the current browse dir. data-dp-* carry the browse
         path so views.js POSTs the right parent and selects the new folder. -->
    <button type="button" class="newrow" data-dp-path="{{.Path}}" data-dp-full="{{.FullPath}}" onclick="openEditor(this)">
        <span class="plus">+</span> NEW PROJECT&hellip;
    </button>
    <div class="newedit hidden">
        <input type="text" class="dp-newname" placeholder="project-name" autocomplete="off" spellcheck="false" aria-label="New project name" />
        <span class="errline hidden" role="status"></span>
        <div class="erow">
            <label class="gitinit"><input type="checkbox" class="dp-gitinit" checked /> git init</label>
            <div class="grp">
                <button type="button" class="btn btn-ghost" onclick="closeEditor(this)"><span>CANCEL</span></button>
                <button type="button" class="btn btn-primary" onclick="createProject(this)"><span>CREATE</span></button>
            </div>
        </div>
        <span class="hintline">Enter to create &middot; Esc to cancel</span>
    </div>

    <!-- Selected folder's actions (start-new + previous sessions); filled by views.js -->
    <div id="session-actions"></div>
</form>
{{end}}
