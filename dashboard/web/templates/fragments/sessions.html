{{define "sessions"}}
<span id="session-count" class="hidden">{{len .Sessions}}</span>
{{if .Sessions}}
{{range .Sessions}}
<div class="session-card rounded-lg p-3 cursor-pointer group select-none"
     data-terminal-id="{{.Name}}"
     data-session="{{.DisplayName}}"
>
    <div class="flex items-center justify-between mb-1.5">
        <span class="font-mono text-xs text-base-content/70">{{.Name}}</span>
        <span class="text-[10px] text-base-content/40 font-mono session-duration" data-created="{{.CreatedAt.Unix}}">{{.Duration}}</span>
    </div>
    <div class="font-medium text-sm text-base-content truncate">{{.DisplayName}}</div>
    <div class="text-[11px] text-base-content/40 truncate">{{.CWD}}</div>
    <div class="flex items-center justify-between mt-2">
        {{if .Alive}}
        <span class="text-[10px] text-emerald-500/60 font-mono">active</span>
        {{else}}
        <span class="text-[10px] text-base-content/30 font-mono">stopped</span>
        {{end}}
        <div class="flex items-center gap-1">
            <button onclick="event.stopPropagation(); openRenameModal('{{.Name}}', '{{.DisplayName}}')"
                    class="btn btn-ghost btn-sm text-base-content/50 hover:text-base-content hover:bg-base-content/10 opacity-0 group-hover:opacity-100 transition-all"
                    title="Rename session">
                ✏
            </button>
            <button class="btn btn-ghost btn-sm text-error/70 hover:text-error hover:bg-error/10 opacity-0 group-hover:opacity-100 transition-all"
                    title="Kill session"
                    hx-delete="/api/sessions/{{.Name}}"
                    hx-target="#session-list"
                    hx-swap="innerHTML"
                    onclick="event.stopPropagation(); cleanupKilledSession('{{.Name}}')">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </div>
</div>
{{end}}
{{else}}
<div class="flex flex-col items-center justify-center py-12 text-center select-none">
    <svg class="w-10 h-10 text-base-content/15 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
    <p class="text-sm text-base-content/40 mb-1">No sessions running</p>
    <p class="text-xs text-base-content/25">Click "New" to create a session</p>
</div>
{{end}}
{{end}}
