set -g default-terminal "xterm-256color"
set -g history-limit 50000
set -g mouse off
set -g status off
set -g window-size latest
# Disable alternate screen for the outer terminal so xterm.js accumulates
# scrollback and mouse wheel scrolling works. tmux still handles alternate
# screen internally for Claude Code's TUI.
set -ga terminal-overrides ',xterm-256color:smcup@:rmcup@'
